name: Build StudyBoard

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Prepare portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/StudyBoard | Out-Null
          Copy-Item build/StudyBoard.exe dist/StudyBoard/StudyBoard.exe
          windeployqt --release --no-translations --compiler-runtime dist/StudyBoard/StudyBoard.exe
          Compress-Archive -Path dist/StudyBoard/* -DestinationPath StudyBoard-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBoard-Windows-x64
          path: StudyBoard-Windows-x64.zip

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libfuse2 wget

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build and install to AppDir
        run: |
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Build AppImage
        env:
          OUTPUT: StudyBoard-Linux-x86_64.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.studyboard.StudyBoard.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/io.github.studyboard.StudyBoard.svg \
            --plugin qt \
            --output appimage
          test -f "$OUTPUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBoard-Linux-x86_64
          path: StudyBoard-Linux-x86_64.AppImage

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: StudyBoard-Windows-x64
          path: release-assets/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: StudyBoard-Linux-x86_64
          path: release-assets/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/StudyBoard-Windows-x64.zip
            release-assets/linux/StudyBoard-Linux-x86_64.AppImage
